<details id="candidate-panel">
  <summary>Explore clusters for your interests</summary>
  <p>
    Choose acceptable ranges. Broad ranges can fit several clusters. These five
    preferences describe the work you want, not your admission chances.
  </p>
  <form id="candidate-form">
    <div class="candidate-fields"></div>
    <button type="submit">Suggest clusters</button>
    <button type="button" id="candidate-clear">Clear suggestions</button>
    <label
      ><input id="candidate-markers" type="checkbox" /> Show approximate profile
      placements</label
    >
  </form>
  <p id="candidate-quality"></p>
  <div id="candidate-results" role="status" aria-live="polite"></div>
</details>
